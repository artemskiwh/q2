name: Fetch product images (Exa + Cloudinary)

on:
  workflow_dispatch:
  push:
    branches: [ main, master, claude/vape-shop-website-8Fk6I ]
    paths:
      - 'scripts/fetch-product-images.mjs'
      - '.github/workflows/exa-fetch.yml'

permissions:
  contents: write

jobs:
  fetch-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Fetch images via Exa and upload to Cloudinary
        continue-on-error: true
        run: |
          mkdir -p tmp
          set +e
          node scripts/fetch-product-images.mjs > tmp/exa-fetch.log 2>&1
          echo "EXIT_CODE=$?" >> tmp/exa-fetch.log
          tail -200 tmp/exa-fetch.log
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      - name: Commit updated product-images.ts
        if: always()
        run: |
          echo "=== Files in tmp/ ==="
          ls -la tmp/ || echo "tmp/ does not exist"
          echo "=== Files in workspace ==="
          ls -la
          mkdir -p tmp
          echo "Run #${{ github.run_number }} at $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> tmp/exa-fetch.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Sync with remote in case another workflow pushed first
          git pull --rebase origin ${{ github.ref_name }} || true
          git add lib/product-images.ts tmp/exa-fetch.log
          git status
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: fetch real product images via Exa+Cloudinary"
          git push origin HEAD:${{ github.ref_name }}
