name: Fetch product images (Exa + Cloudinary)

on:
  workflow_dispatch:
  push:
    branches: [ main, master, claude/vape-shop-website-8Fk6I ]
    paths:
      - 'scripts/fetch-product-images.mjs'
      - '.github/workflows/exa-fetch.yml'

permissions:
  contents: write

jobs:
  fetch-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Fetch images via Exa and upload to Cloudinary
        run: node scripts/fetch-product-images.mjs
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      - name: Commit updated product-images.ts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/product-images.ts
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: fetch real product images via Exa+Cloudinary"
          git push origin HEAD:${{ github.ref_name }}
