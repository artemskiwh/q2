name: Fetch brand logos from Clearbit

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Re-download logos that already exist"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  push:
    branches: [ claude/vape-shop-website-8Fk6I ]
    paths:
      - 'scripts/fetch-brand-logos.mjs'
      - '.github/workflows/fetch-brand-logos.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download logos
        run: |
          mkdir -p tmp
          if [ "${{ inputs.force }}" = "true" ]; then
            node scripts/fetch-brand-logos.mjs --force 2>&1 | tee tmp/clearbit-fetch.log
          else
            node scripts/fetch-brand-logos.mjs 2>&1 | tee tmp/clearbit-fetch.log
          fi

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p public/assets/logos
          git add public/assets/logos lib/brand-logos.ts tmp/clearbit-fetch.log || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: fetch brand logos from Clearbit"
          git push origin HEAD:${{ github.ref_name }}
