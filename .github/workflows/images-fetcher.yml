name: Fetch product images (Exa + Cloudinary)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  fetch-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Fetch images via Exa and upload to Cloudinary
        run: npm run fetch-images
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}

      - name: Commit updated product-images.ts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/product-images.ts
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update product images"
          git push
