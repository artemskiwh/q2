name: Process category images (rembg)

on:
  workflow_dispatch:
  push:
    branches: [ claude/vape-shop-website-8Fk6I ]
    paths:
      - 'scripts/process-category-images.py'
      - '.github/workflows/process-category-images.yml'

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install rembg + Pillow
        run: pip install --quiet Pillow rembg onnxruntime

      - name: Remove backgrounds
        run: |
          set -e
          mkdir -p tmp
          python scripts/process-category-images.py 2>&1 | tee tmp/process-category-images.log
          echo "--- ls public/products/cat-*.png ---"
          ls -la public/products/cat-*.png 2>&1 || echo "no cat-*.png files"

      - name: Commit and push
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/products/cat-*.png tmp/process-category-images.log 2>&1 || true
          git status
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git pull --rebase origin ${{ github.ref_name }} || true
          git commit -m "chore: cut backgrounds from category photos via rembg"
          git push origin HEAD:${{ github.ref_name }}
