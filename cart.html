<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d0d0d">
    <title>Корзина — TYAG MOSKVA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div data-partial="age-gate"></div>
    <div data-partial="header" data-active="cart"></div>

    <main class="page">
        <div class="container">
            <div class="breadcrumbs">
                <a href="index.html">Главная</a><span>/</span><span>Корзина</span>
            </div>
            <h1 style="margin:0 0 22px; font-size:28px; font-weight:800;">Корзина</h1>

            <div id="cart-root"></div>
        </div>
    </main>

    <div data-partial="footer"></div>
    <div data-partial="mobile-nav" data-active="cart"></div>

    <script src="js/products.js"></script>
    <script src="js/partials.js"></script>
    <script src="js/main.js"></script>
    <script>
    function renderCart() {
        const root = document.getElementById('cart-root');
        const items = Cart.items;
        if (items.length === 0) {
            root.innerHTML = `
                <div class="empty-state">
                    <h3>Корзина пуста</h3>
                    <p>Самое время заглянуть в каталог и выбрать что-нибудь интересное.</p>
                    <a class="btn btn-primary" href="catalog.html">Перейти в каталог</a>
                </div>`;
            return;
        }
        const subtotal = Cart.total();
        const shipping = subtotal >= 5000 ? 0 : 350;
        const total = subtotal + shipping;

        root.innerHTML = `
            <div class="cart-layout">
                <div class="cart-list" id="cart-list">
                    ${items.map(it => {
                        const p = getProductById(it.id);
                        if (!p) return '';
                        return `
                            <article class="cart-item" data-id="${p.id}">
                                <a href="product.html?id=${p.id}" class="cart-item-img">${productSVG(p)}</a>
                                <div class="cart-item-info">
                                    <h3><a href="product.html?id=${p.id}">${escapeXml(p.name)}</a></h3>
                                    <p>${escapeXml(p.flavor || '')} · ${escapeXml(p.brand)}</p>
                                    <div class="price">${formatPrice(p.price * it.qty)}</div>
                                </div>
                                <div class="cart-item-actions">
                                    <div class="qty">
                                        <button data-qty="-" data-id="${p.id}">−</button>
                                        <input type="number" value="${it.qty}" min="1" data-qty-input="${p.id}">
                                        <button data-qty="+" data-id="${p.id}">+</button>
                                    </div>
                                    <button class="remove-btn" data-remove="${p.id}">Удалить</button>
                                </div>
                            </article>
                        `;
                    }).join('')}
                </div>
                <aside class="summary">
                    <h2>Ваш заказ</h2>
                    <div class="summary-row"><span>Товары (${Cart.count()} шт.)</span><span>${formatPrice(subtotal)}</span></div>
                    <div class="summary-row"><span>Доставка</span><span>${shipping === 0 ? 'Бесплатно' : formatPrice(shipping)}</span></div>
                    <div class="summary-row total"><span>Итого</span><span>${formatPrice(total)}</span></div>
                    <button class="btn btn-primary btn-block" id="checkout-btn">Оформить заказ</button>
                    <p class="summary-note">При заказе от 5 000 ₽ доставка по Москве бесплатно. Оптовикам — индивидуальная цена.</p>
                </aside>
            </div>
        `;

        document.querySelectorAll('[data-qty]').forEach(btn => {
            btn.addEventListener('click', () => {
                const id = btn.dataset.id;
                const it = Cart.items.find(i => i.id === id);
                if (!it) return;
                if (btn.dataset.qty === '+') Cart.setQty(id, it.qty + 1);
                else Cart.setQty(id, Math.max(1, it.qty - 1));
                renderCart();
            });
        });
        document.querySelectorAll('[data-qty-input]').forEach(input => {
            input.addEventListener('change', () => {
                Cart.setQty(input.dataset.qtyInput, Math.max(1, +input.value || 1));
                renderCart();
            });
        });
        document.querySelectorAll('[data-remove]').forEach(btn => {
            btn.addEventListener('click', () => {
                Cart.remove(btn.dataset.remove);
                renderCart();
                toast('Товар удалён');
            });
        });
        document.getElementById('checkout-btn').addEventListener('click', () => {
            toast('Заказ оформлен! Мы свяжемся с вами в Telegram');
            setTimeout(() => {
                Cart.clear();
                renderCart();
            }, 1200);
        });
    }

    document.addEventListener('DOMContentLoaded', renderCart);
    </script>
</body>
</html>
