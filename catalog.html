<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог — TYAG МОСКВА</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <nav class="breadcrumbs">
      <a href="/index.html">Главная</a>
      <span class="sep">/</span>
      <span class="current" id="bc-current">Каталог</span>
    </nav>

    <div class="catalog-layout">
      <aside class="filters">
        <div class="filter-group">
          <div class="filter-title">Категория</div>
          <div id="filter-categories"></div>
        </div>
        <div class="filter-group">
          <div class="filter-title">Бренд</div>
          <div id="filter-brands"></div>
        </div>
        <div class="filter-group">
          <div class="filter-title">Цена, ₽</div>
          <div style="display: flex; gap: 8px;">
            <input type="number" id="price-min" placeholder="от" style="width: 100%; height: 36px; background: var(--bg-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 0 10px; font-size: 13px; outline: none;">
            <input type="number" id="price-max" placeholder="до" style="width: 100%; height: 36px; background: var(--bg-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 0 10px; font-size: 13px; outline: none;">
          </div>
        </div>
        <button class="btn btn-primary btn-block" style="margin-top: 18px;" onclick="applyFilters()">Применить</button>
        <button class="btn btn-ghost btn-block" style="margin-top: 8px;" onclick="resetFilters()">Сбросить</button>
      </aside>

      <section>
        <div class="catalog-toolbar">
          <div class="catalog-count" id="catalog-count">0 товаров</div>
          <select class="sort" id="sort">
            <option value="default">По умолчанию</option>
            <option value="price-asc">Цена: по возрастанию</option>
            <option value="price-desc">Цена: по убыванию</option>
            <option value="name-asc">Название: А–Я</option>
          </select>
        </div>
        <div class="products" id="products-grid"></div>
        <div id="empty" class="empty-state" style="display: none;">
          <div>
            <h2>Ничего не найдено</h2>
            <p>Попробуйте изменить фильтры или поисковый запрос.</p>
            <button class="btn btn-secondary" onclick="resetFilters()">Сбросить фильтры</button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>
  <div id="site-modal"></div>

  <script src="/js/products.js"></script>
  <script src="/js/main.js"></script>
  <script>
    initLayout({ page: 'catalog', activeTab: 'catalog' });

    const params = new URLSearchParams(location.search);
    const initialCat = params.get('cat');
    const initialQuery = (params.get('q') || '').toLowerCase().trim();
    const selectedCats   = new Set(initialCat ? [initialCat] : []);
    const selectedBrands = new Set();

    if (initialCat) {
      const c = CATEGORIES.find(c => c.id === initialCat);
      if (c) document.getElementById('bc-current').textContent = c.title;
    } else if (initialQuery) {
      document.getElementById('bc-current').textContent = 'Поиск: ' + initialQuery;
    }

    // Render category filters
    document.getElementById('filter-categories').innerHTML = CATEGORIES.map(c => `
      <label class="filter-option">
        <input type="checkbox" value="${c.id}" data-cat ${selectedCats.has(c.id) ? 'checked' : ''}>
        <span class="checkbox"></span>
        <span>${c.title}</span>
        <span class="count">${getCategoryCount(c.id)}</span>
      </label>
    `).join('');

    // Render brand filters
    const brands = [...new Set(PRODUCTS.map(p => p.brand))].sort();
    document.getElementById('filter-brands').innerHTML = brands.map(b => `
      <label class="filter-option">
        <input type="checkbox" value="${b}" data-brand>
        <span class="checkbox"></span>
        <span>${b}</span>
        <span class="count">${PRODUCTS.filter(p => p.brand === b).length}</span>
      </label>
    `).join('');

    function getFiltered() {
      const min = parseInt(document.getElementById('price-min').value) || 0;
      const max = parseInt(document.getElementById('price-max').value) || Infinity;
      return PRODUCTS.filter(p => {
        if (selectedCats.size && !selectedCats.has(p.category)) return false;
        if (selectedBrands.size && !selectedBrands.has(p.brand)) return false;
        if (p.price < min || p.price > max) return false;
        if (initialQuery) {
          const hay = (p.name + ' ' + p.flavor + ' ' + p.brand).toLowerCase();
          if (!hay.includes(initialQuery)) return false;
        }
        return true;
      });
    }

    function sortList(list) {
      const s = document.getElementById('sort').value;
      const a = [...list];
      if (s === 'price-asc')  a.sort((x,y) => x.price - y.price);
      if (s === 'price-desc') a.sort((x,y) => y.price - x.price);
      if (s === 'name-asc')   a.sort((x,y) => x.name.localeCompare(y.name, 'ru'));
      return a;
    }

    function render() {
      const list = sortList(getFiltered());
      document.getElementById('catalog-count').textContent =
        `${list.length} ${pluralRu(list.length, 'товар', 'товара', 'товаров')}`;
      document.getElementById('products-grid').innerHTML = list.map(productCard).join('');
      document.getElementById('empty').style.display = list.length ? 'none' : 'block';
      document.getElementById('products-grid').style.display = list.length ? '' : 'none';
    }

    function applyFilters() {
      selectedCats.clear();
      selectedBrands.clear();
      document.querySelectorAll('[data-cat]:checked').forEach(el => selectedCats.add(el.value));
      document.querySelectorAll('[data-brand]:checked').forEach(el => selectedBrands.add(el.value));
      render();
    }

    function resetFilters() {
      selectedCats.clear();
      selectedBrands.clear();
      document.querySelectorAll('[data-cat], [data-brand]').forEach(el => el.checked = false);
      document.getElementById('price-min').value = '';
      document.getElementById('price-max').value = '';
      document.getElementById('sort').value = 'default';
      render();
    }

    document.getElementById('sort').addEventListener('change', render);
    document.querySelectorAll('[data-cat], [data-brand]').forEach(el => el.addEventListener('change', applyFilters));

    render();
  </script>
</body>
</html>
