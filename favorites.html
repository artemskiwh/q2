<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Избранное — TYAG МОСКВА</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <nav class="breadcrumbs">
      <a href="/index.html">Главная</a>
      <span class="sep">/</span>
      <span class="current">Избранное</span>
    </nav>
    <h1 style="font-family:'Oswald',sans-serif;font-size:32px;letter-spacing:1px;text-transform:uppercase;margin:8px 0 18px;">Избранное</h1>
    <div id="fav-root"></div>
  </main>

  <div id="site-footer"></div>
  <div id="site-modal"></div>

  <script src="/js/products.js"></script>
  <script src="/js/main.js"></script>
  <script>
    initLayout({ page: 'favorites', activeTab: 'catalog' });

    function render() {
      const ids = getFavs();
      const items = ids.map(findProduct).filter(Boolean);
      const root = document.getElementById('fav-root');
      if (items.length === 0) {
        root.innerHTML = `
          <div class="cart-empty">
            ${ICON.heart}
            <h2>В избранном пока пусто</h2>
            <p>Сохраняйте товары, чтобы вернуться к ним позже</p>
            <a class="btn btn-primary" href="/catalog.html">К каталогу</a>
          </div>
        `;
      } else {
        root.innerHTML = `<div class="products">${items.map(productCard).join('')}</div>`;
      }
    }
    render();
    window.addEventListener('storage', render);
  </script>
</body>
</html>
