<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d0d0d">
    <title>Избранное — TYAG MOSKVA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div data-partial="age-gate"></div>
    <div data-partial="header" data-active="favorites"></div>

    <main class="page">
        <div class="container">
            <div class="breadcrumbs">
                <a href="index.html">Главная</a><span>/</span><span>Избранное</span>
            </div>
            <h1 style="margin:0 0 22px; font-size:28px; font-weight:800;">Избранное</h1>

            <div id="fav-root"></div>
        </div>
    </main>

    <div data-partial="footer"></div>
    <div data-partial="mobile-nav" data-active="favorites"></div>

    <script src="js/products.js"></script>
    <script src="js/partials.js"></script>
    <script src="js/main.js"></script>
    <script>
    function renderFavorites() {
        const root = document.getElementById('fav-root');
        const items = Favorites.items.map(id => getProductById(id)).filter(Boolean);
        if (items.length === 0) {
            root.innerHTML = `
                <div class="empty-state">
                    <h3>В избранном пока пусто</h3>
                    <p>Добавляйте сюда товары, чтобы вернуться к ним позже.</p>
                    <a class="btn btn-primary" href="catalog.html">Перейти в каталог</a>
                </div>`;
            return;
        }
        root.innerHTML = `<div class="products-grid">${items.map(renderProductCard).join('')}</div>`;
    }
    document.addEventListener('DOMContentLoaded', () => {
        renderFavorites();
        // Re-render on fav toggle so removed items disappear
        document.getElementById('fav-root').addEventListener('click', (e) => {
            if (e.target.closest('[data-fav]')) {
                setTimeout(renderFavorites, 60);
            }
        });
    });
    </script>
</body>
</html>
