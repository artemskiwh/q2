<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d0d0d">
    <meta name="description" content="TYAG MOSKVA — оптовый магазин вейпов в Москве. Одноразовые электронные сигареты, POD-системы, жидкости, аксессуары и расходники с быстрой доставкой.">
    <title>TYAG MOSKVA — оптовый магазин вейпов в Москве</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div data-partial="age-gate"></div>
    <div data-partial="header" data-active="home"></div>

    <main class="page">
        <div class="container">
            <!-- Categories -->
            <section class="section">
                <div class="section-head">
                    <h2 class="section-title">Категории</h2>
                    <a class="section-more" href="catalog.html">Смотреть всё →</a>
                </div>
                <div class="categories" id="categories"></div>
            </section>

            <!-- Catalog -->
            <section class="section">
                <div class="section-head">
                    <h2 class="section-title">Каталог</h2>
                    <a class="section-more" href="catalog.html">Смотреть всё →</a>
                </div>
                <div class="products-grid" id="catalog-preview"></div>
            </section>
        </div>
    </main>

    <div data-partial="footer"></div>
    <div data-partial="mobile-nav" data-active="home"></div>

    <script src="js/products.js"></script>
    <script src="js/partials.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Render categories
            const catEl = document.getElementById('categories');
            catEl.innerHTML = CATEGORIES.map(c => `
                <a href="catalog.html?cat=${c.id}" class="category-card">
                    <div class="category-icon">${categoryIconSVG(c.id)}</div>
                    <h3 class="category-name">${c.name}</h3>
                    <span class="category-count">${getCategoryCount(c.id)} товаров</span>
                </a>
            `).join('');

            // Render preview - 8 popular products with diverse brands AND palettes
            const previewEl = document.getElementById('catalog-preview');
            const wantedBrandModels = [
                ['WAKA', '8000'],
                ['ELFBAR', 'Monnight 25000'],
                ['GEEKBAR', '50000'],
                ['FIZZY', 'Great 10000'],
                ['Vozol', 'Shisha 25000'],
                ['Bubble Mon', '30000'],
                ['GEEKBAR', '32000'],
                ['Puffmi', 'Pure 12000']
            ];
            const palettesUsed = new Set();
            const preview = [];
            for (const [brand, modelPart] of wantedBrandModels) {
                const candidates = PRODUCTS.filter(p =>
                    p.brand === brand && p.name.includes(modelPart) && !palettesUsed.has(p.palette));
                const pick = candidates[0] || PRODUCTS.find(p => p.brand === brand && p.name.includes(modelPart));
                if (pick) {
                    palettesUsed.add(pick.palette);
                    preview.push(pick);
                }
            }
            previewEl.innerHTML = preview.map(renderProductCard).join('');
        });
    </script>
</body>
</html>
